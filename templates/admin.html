<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel do Administrador</title>
    <link rel="stylesheet" href="/css/main.css">
    </head>
<body>
    <nav class="menu">
        <a href="/"><img src="/assets/logo.png" alt="Nouvelle" width="200" height="100"></a>
        <ul class="menu-links">
            <li><a href="/">Voltar para o Site</a></li>
        </ul>
    </nav>

    <main style="padding: 40px; color: white; text-align: center;">
        <h1 style="color: #F0AD12;">Painel de Controle - Administração</h1>
        <p>Bem-vindo. Você tem acesso total ao sistema Nouvelle.</p>
        
        <div style="margin-top: 50px; display: flex; justify-content: center; gap: 20px;">
            <div style="background-color: #333; padding: 20px; border-radius: 8px; width: 300px;">
                <h3 style="color: #F0AD12;">Gerenciar Filmes</h3>
                <p>Adicionar ou remover filmes de cartaz.</p>
                <button class="btn-login" style="margin-top: 15px;">Acessar</button>
            </div>
            <div style="background-color: #333; padding: 20px; border-radius: 8px; width: 300px;">
                <h3 style="color: #F0AD12;">Gerenciar Sessões</h3>
                <p>Adicionar, atualizar ou remover sessões.</p>
                <button class="btn-login" style="margin-top: 15px;">Acessar</button>
            </div>
            <div style="background-color: #333; padding: 20px; border-radius: 8px; width: 300px;">
                <h3 style="color: #F0AD12;">Gerenciar Usuários</h3>
                <p>Ver lista de clientes cadastrados.</p>
                <button class="btn-login" style="margin-top: 15px;">Acessar</button>
            </div>
        </div>
    </main>
</body>
</html>
